spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:bookstore_order}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  hikari:
    maximum-pool-size: ${DB_MAX_POOL_SIZE:4}
    minimum-idle: ${DB_MIN_IDLE:1}
    connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
    idle-timeout: ${DB_IDLE_TIMEOUT:300000}
    max-lifetime: ${DB_MAX_LIFETIME:600000}
    keepalive-time: ${DB_KEEPALIVE_TIME:120000}

book-service:
  url: ${BOOK_SERVICE_URL:http://book-service:8080}

user-service:
  url: ${USER_SERVICE_URL:http://user-service:8080}

promotion-service:
  url: ${PROMOTION_SERVICE_URL:http://promotion-service:8080}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://payment-service:8080}
